server:
  port: 2222

spring:
  profiles:
    active: prod
  application:
    name: rempms-notification-service

  cloud:
    openfeign:
      okhttp:
        enabled: true

    function:
      definition: email
    stream:
      default-binder: kafka
      kafka:
        binder:
          brokers:
            - localhost:9094
          autoCreateTopics: true
      bindings:
        email-in-0:
          destination: user-registration
          group: ${spring.application.name}-email
          content-type: application/json

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8070/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    org:
      springframework:
        cloud: DEBUG